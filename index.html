<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>にこのさくひん</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 浮遊パーティクル背景 -->
  <canvas id="particles" class="particles-canvas"></canvas>

  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">
        <span class="title-char" style="--i:0">に</span>
        <span class="title-char" style="--i:1">こ</span>
        <span class="title-char" style="--i:2">の</span>
        <span class="title-char" style="--i:3">さ</span>
        <span class="title-char" style="--i:4">く</span>
        <span class="title-char" style="--i:5">ひ</span>
        <span class="title-char" style="--i:6">ん</span>
      </h1>
      <p class="site-subtitle">みんなみてね！</p>
    </div>
    <div class="header-wave">
      <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
        <path d="M0,64 C360,120 720,0 1080,64 C1260,96 1380,80 1440,64 L1440,120 L0,120 Z" />
      </svg>
    </div>
  </header>

  <main class="gallery-container">
    <div class="upload-bar">
      <button
        type="button"
        class="upload-trigger"
        id="uploadTrigger"
        aria-haspopup="dialog"
        aria-controls="uploadPanel"
        aria-expanded="false"
      >
        <span class="upload-trigger-icon" aria-hidden="true">＋</span>
        <span>さくひんをおくる</span>
      </button>
    </div>

    <div class="gallery-grid" id="gallery">
      <!-- 作品カードはJSで生成 -->
    </div>
  </main>

  <!-- 作品投稿パネル -->
  <div
    class="modal-overlay upload-overlay"
    id="uploadPanel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="uploadHeading"
    aria-hidden="true"
  >
    <div class="modal-content upload-content">
      <button class="modal-close" id="uploadClose" aria-label="閉じる">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M1 1L17 17M17 1L1 17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>

      <h2 class="upload-heading" id="uploadHeading">さくひんをおくる</h2>
      <p class="upload-lead">
        かいたさくひんのことをおしえてね。<br>
        「GitHub にすすむ」をおすとページがひらくから、<strong>そこにしゃしんをつけて</strong>おくってね。
      </p>

      <form class="upload-form" id="uploadForm" novalidate>
        <div class="upload-field">
          <label class="upload-label" for="uploadTitle">
            タイトル <span class="upload-required">かならず</span>
          </label>
          <input
            class="upload-input"
            id="uploadTitle"
            name="title"
            type="text"
            maxlength="30"
            autocomplete="off"
            placeholder="おひさまとおはな"
          >
          <p class="upload-counter" id="uploadTitleCounter" aria-hidden="true">0 / 30</p>
        </div>

        <div class="upload-field">
          <label class="upload-label" for="uploadDescription">せつめい</label>
          <textarea
            class="upload-input upload-textarea"
            id="uploadDescription"
            name="description"
            rows="3"
            maxlength="200"
            placeholder="おひさまがにこにこわらっているよ！"
          ></textarea>
          <p class="upload-counter" id="uploadDescriptionCounter" aria-hidden="true">0 / 200</p>
        </div>

        <div class="upload-field">
          <label class="upload-label" for="uploadDate">
            つくったひ <span class="upload-required">かならず</span>
          </label>
          <input class="upload-input" id="uploadDate" name="date" type="date">
        </div>

        <ul class="upload-errors" id="uploadErrors" role="alert" hidden></ul>

        <button class="upload-submit" id="uploadSubmit" type="submit">GitHub にすすむ</button>
        <p class="upload-status" id="uploadStatus" role="status" hidden></p>

        <p class="upload-note">
          しゃしんは GitHub のページであとからつけるよ。<br>
          おくられたさくひんは、おうちのひとがかくにんしてからギャラリーにならぶよ。
        </p>
      </form>
    </div>
  </div>

  <!-- モーダル -->
  <div class="modal-overlay" id="modal" aria-hidden="true">
    <div class="modal-content">
      <button class="modal-close" id="modalClose" aria-label="閉じる">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M1 1L17 17M17 1L1 17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="modal-image-wrapper">
        <img src="" alt="" id="modalImage" class="modal-image">
        <div class="modal-placeholder-bg" id="modalPlaceholder"></div>
      </div>
      <div class="modal-info">
        <h2 class="modal-title" id="modalTitle"></h2>
        <p class="modal-description" id="modalDescription"></p>
        <p class="modal-date" id="modalDate"></p>
        <div class="modal-stats">
          <div class="stat-badge views-badge">
            <span class="stat-icon">👀</span>
            <span id="modalViews">0</span>
          </div>
          <button class="like-btn-fancy" id="modalLike">
            <span class="like-icon" id="modalLikeIcon">🤍</span>
            <span class="like-count" id="modalLikeCount">0</span>
            <span class="like-ripple"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-star">✦</span>
      にこのさくひん
      <span class="footer-star">✦</span>
    </div>
  </footer>

  <script src="works.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
